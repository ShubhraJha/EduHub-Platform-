<!DOCTYPE html>
<html>
<head>
    <title>Edu Platform</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Top bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1e3a8a;
            color: white;
        }

        .nav-right a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .nav-right a:hover {
            text-decoration: underline;
        }

        /* Hero section */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            background: #f4f4f4;
        }

        .hero img {
            width: 70%;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .title {
            text-align: center;
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div>
            <h2>Edu Online Platform</h2>
        </div>

        <div class="nav-right">
            <a href="/login">🔑 Login</a>
            <a href="/signup">📝 Signup</a>
        </div>
    </div>

    <!-- HERO IMAGE -->
    <div class="hero">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
             alt="Education Image">
    </div>

    <div class="title">
        Learn Anytime, Anywhere 🚀
    </div>

</body>
</html>
