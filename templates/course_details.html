<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 150px;
        }

        .card-body {
            padding: 10px;
        }

        .price {
            color: purple;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px;
            background: purple;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h2>{{ course.name }}</h2>

<div class="container">

{% for b in course.batches %}
<div class="card">

    <img src="https://via.placeholder.com/300">

    <div class="card-body">
        <h4>{{ b.name }}</h4>

        <div class="price">₹{{ b.price }}</div>

        <p>Start: {{ b.start }}</p>
        <p>End: {{ b.end }}</p>

        <a class="btn" href="/enroll/{{ b.id }}">Buy Now</a>
    </div>

</div>
{% endfor %}

</div>

</body>
</html>
