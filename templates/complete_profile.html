<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EduHub | Complete Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#eef2ff;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

}

/* Card */

.profile-box{

    width:650px;

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 10px 30px rgba(0,0,0,.12);

}

/* Header */

.header{

    background:linear-gradient(135deg,#1e3a8a,#3b82f6);

    color:white;

    padding:35px;

}

.header h2{

    font-weight:bold;

    margin-bottom:8px;

}

.header p{

    opacity:.9;

    margin:0;

}

/* Body */

.form-area{

    padding:35px;

}

label{

    font-weight:600;

    color:#374151;

    margin-bottom:8px;

}

.form-control,
.form-select{

    border-radius:10px;

    padding:11px;

    border:1px solid #d1d5db;

}

.form-control:focus,
.form-select:focus{

    border-color:#1e40af;

    box-shadow:0 0 0 .15rem rgba(30,64,175,.15);

}

/* Button */

.btn-save{

    width:100%;

    background:#d97706;

    color:white;

    padding:13px;

    border:none;

    border-radius:10px;

    font-weight:bold;

    font-size:16px;

}

.btn-save:hover{

    background:#b45309;

}

/* Footer */

.footer{

    margin-top:25px;

    text-align:center;

    color:#777;

    font-size:14px;

}

</style>

</head>

<body>

<div class="profile-box">

<div class="header">

<h2>Complete Your Profile</h2>

<p>
Please provide your details to activate your student account and continue your enrollment.
</p>

</div>

<div class="form-area">

<form action="/student/complete-profile" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Date of Birth</label>

<input
type="date"
name="dob"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Student Phone</label>

<input
type="text"
name="student_phone"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Parent Phone</label>

<input
type="text"
name="parent_phone"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label>Gender</label>

<select
name="gender"
class="form-select">

<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>City / State</label>

<input
type="text"
name="city"
class="form-control"
placeholder="Optional">

</div>

<div class="col-12 mb-3">

<label>Address</label>

<textarea
name="address"
rows="4"
class="form-control"
placeholder="Enter your complete address"></textarea>

</div>

<div class="col-12 mt-2">

<button class="btn-save">

Save Profile & Continue

</button>

</div>

</div>

</form>

<div class="footer">

EduHub Student Portal

</div>

</div>

</div>

</body>

</html>
