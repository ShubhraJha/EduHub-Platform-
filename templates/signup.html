<!DOCTYPE html>
<html>
<head>

    <title>Sign Up</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:url("/static/books.jpg");
            background-size:cover;
            background-position:center;
        }

        .box{
            width:425px;
            padding:55px;
            padding-bottom:65px;
            background:white;
            border-radius:10px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2 class="text-center mb-4">Sign Up</h2>

        {% if error %}
            <p style="color:red">{{ error }}</p>
        {% endif %}

        <form action="/signup" method="POST">

            <!-- Email -->

            <div class="mb-3">

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    class="form-control"
                    required>

                {% if msg %}
                    <p class="text-danger m-0">{{ msg }}</p>
                {% endif %}

            </div>


            <!-- Password -->

            <div class="mb-3">

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    class="form-control"
                    required>

                {% if msg %}
                    <p class="text-danger m-0">{{ msg }}</p>
                {% endif %}

            </div>


            <!-- Confirm Password -->

            <div class="mb-4">

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    class="form-control"
                    required>

            </div>


            <!-- Signup Button -->

            <button
                type="submit"
                class="btn btn-primary w-100">

                Sign Up

            </button>

        </form>


        <!-- Login Link -->

        <p class="text-center mt-4 mb-0">

            Already have an account?

            <a
                href="/login"
                class="text-decoration-none">

                Login

            </a>

        </p>

    </div>

</body>
</html>
